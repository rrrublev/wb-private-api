name: Update upstream routes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/update-upstreams-routes.js

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/UpstreamRoutes.js; then
            exit 0
          fi

          branch="automation/update-upstreams-routes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add src/UpstreamRoutes.js
          git commit -m "chore: update upstream route snapshot"
          git push --force origin "HEAD:$branch"

          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: update upstream route snapshot" --body "Automated update from WB upstreams."
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "chore: update upstream route snapshot" --body "Automated update from WB upstreams."
          fi
